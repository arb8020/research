[project]
name = "infra-utils"
version = "0.1.0"
description = "Infrastructure utilities: retry, SSH validation, logging, credential config"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["infra_utils"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
