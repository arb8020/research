[project]
name = "agent-blame"
version = "0.0.1"
description = "git blame for coding agents: attribute lines to the agent sessions that wrote them"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-blame = "agent_blame.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_blame*"]
