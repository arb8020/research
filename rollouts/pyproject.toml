[project]
name = "rollouts"
version = "0.2.0"
description = "Lightweight framework for LLM evaluation and agentic RL with tool support"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "dacite>=1.8.0",
    "aiohttp>=3.9.0",
    "trio>=0.32.0",
    "httpx>=0.25.0",
    "markdownify>=0.11.0",
    "plotext>=5.3.2",
    "zstandard>=0.25.0",
    "python-chess>=1.999",
    "python-dotenv>=1.0.0",
    "pytui",
]

[project.scripts]
rollouts = "rollouts.cli:main"

[project.optional-dependencies]
# Dataset evaluation
eval = [
    "datasets>=4.4.1",
]

# Tinygrad renderer eval (WebGPU backend)
tinygrad-webgpu = [
    "dawn-python>=0.3.0",
]

# Training (RL, torch, etc.)
training = [
    "torch>=2.0.0",
    "datasets>=4.4.1",
    "huggingface_hub>=0.20.0",
    "peft>=0.7.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
]

# Deployment (GPU provisioning + server management + remote monitoring)
deploy = [
    "bifrost",
    "broker",
    "miniray",
    "paramiko>=3.0.0",
]

# Modal deployment (fast sandbox-based GPU execution)
modal = [
    "modal>=0.64.0",
    "trio-asyncio>=0.15.0",
]

# Development
dev = [
    "hypothesis>=6.151.9",
    "pytest>=7.0.0",
    "pytest-trio>=0.8.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["rollouts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
