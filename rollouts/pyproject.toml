[project]
name = "rollouts"
version = "0.2.0"
description = "Lightweight framework for LLM evaluation and agentic RL with tool support"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "dacite>=1.8.0",
    "aiohttp>=3.9.0",
    "hypercorn>=0.17.0",
    "trio>=0.32.0",
    "httpx>=0.25.0",
    "markdownify>=0.11.0",
    "plotext>=5.3.2",
    "zstandard>=0.25.0",
    "python-chess>=1.999",
    "python-dotenv>=1.0.0",
    "pytui",
    "tiktoken>=0.12.0",
    "datasets>=4.4.1",
    "pyarrow>=22.0.0",
    "huggingface-hub>=1.0.0rc2",
]

[project.scripts]
rollouts = "rollouts.cli:main"
rollouts-evals-ui = "rollouts.evals_ui.server:main"
rollouts-evals-ui-dev = "rollouts.evals_ui.launch:main"
rollouts-doctor = "rollouts.tools.doctor:main"

[project.optional-dependencies]
# Dataset evaluation
eval = [
    "datasets>=4.4.1",
]

# Tinygrad renderer eval (WebGPU backend)
tinygrad-webgpu = [
    "dawn-python>=0.3.0",
]

# Training (RL, torch, etc.)
training = [
    "torch>=2.0.0",
    "datasets>=4.4.1",
    "huggingface_hub>=0.20.0",
    "peft>=0.7.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "torchtitan @ git+https://github.com/pytorch/torchtitan.git@v0.2.2",
]

# Deployment (GPU provisioning + server management + remote monitoring)
deploy = [
    "bifrost",
    "broker",
    "infra-utils",
    "miniray",
    "paramiko>=3.0.0",
]

# Modal deployment (fast sandbox-based GPU execution)
modal = [
    "modal>=0.64.0",
    "trio-asyncio>=0.15.0",
]

# REAP expert pruning
reap = [
    "torch>=2.0.0",
    "transformers>=5.0.0",
    "huggingface-hub>=1.4.0",
    "datasets>=4.4.1",
    "accelerate>=0.20.0",
]

# Development
dev = [
    "hypothesis>=6.151.9",
    "pytest>=7.0.0",
    "pytest-trio>=0.8.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["rollouts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/regression",
]
markers = [
    "unit: small focused tests over stable pure or near-pure cut points",
    "integration: default subsystem-boundary tests",
    "regression: bug repros that should stay fixed",
    "live: tests that consume external APIs, CLIs, GPUs, or other costly resources",
    "slow: long-running tests",
    "gpu: tests that require GPU hardware or provisioning",
]
addopts = [
    "--strict-markers",
]

[tool.uv]
# Override SGLang's transformers==4.57.1 pin which has a bug with
# list_repo_templates 404 errors. transformers 5.x has the fix.
# See: https://github.com/huggingface/transformers/issues/41813
override-dependencies = [
    "transformers>=5.0.0",
    "huggingface-hub>=1.4.0",
]
