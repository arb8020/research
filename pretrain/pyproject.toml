[project]
name = "pretrain"
version = "0.1.0"
description = "Minimal pretraining playground"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "numpy",
    "tiktoken",
]

[project.optional-dependencies]
deploy = [
    "bifrost",
    "broker",
    "trio",
]
research = [
    "matplotlib",
    "pandas",
    "duckdb",
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
