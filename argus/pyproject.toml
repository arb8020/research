[project]
name = "argus"
version = "0.1.0"
description = "Run supervision primitives for detached experiment execution"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["argus"]
package-dir = {"argus" = "."}
